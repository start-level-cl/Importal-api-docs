      required:
        - tipo_carga
      type: object
    CreateLogisticsRateRequest:
      additionalProperties: false
      properties:
        concept:
          description: Concepto de cobro logístico
          type: string
        rate_unit:
          description: "Unidad de medida (ej. KG, CBM)"
          type: string
        rate_value:
          description: Valor de la tarifa
          type: number
        sub_type:
          description: Subtipo opcional del concepto
          type: string
        transport_type:
          description: Tipo de carga
          enum:
            - AEREA
            - MARITIMA
          type: string
      required:
        - transport_type
        - concept
        - rate_value
        - rate_unit
      type: object
    CreateMessageRequest:
      additionalProperties: false
      properties:
        message:
          description: Contenido del mensaje
          type: string
      required:
        - message
      type: object
    CreateOrderRequest:
      additionalProperties: false
      example:
        productId: 2
        quantity: 1
        talla: 128GB
      properties:
        cargaId:
          type: integer
        productId:
          type: integer
        quantity:
          type: integer
        talla:
          type: string
      required:
        - productId
        - quantity
        - talla
      type: object
    CreateProductRequest:
      additionalProperties: false
      properties:
        marca:
          type: string
        photo_urls:
          items:
            type: string
          type: array
        price_usd:
          type: number
        status:
          type: string
      required:
        - marca
        - price_usd
      type: object
    DashboardSummary:
      additionalProperties: false
      properties:
        clientes_activos:
