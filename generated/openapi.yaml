components:
  schemas:
    ChangePasswordRequest:
      additionalProperties: false
      properties:
        newPassword:
          description: Nueva clave para la cuenta
          minLength: 6
          type: string
        password:
          description: Clave actual del usuario
          minLength: 1
          type: string
        token:
          description: JWT de acceso del usuario
          type: string
      required:
        - token
        - password
        - newPassword
      type: object
    Chat:
      additionalProperties: false
      properties:
        id:
          type: integer
        provider_code:
          type: string
        transport_type:
          type: string
        user_id:
          type: integer
      required:
        - id
      type: object
    ChatArray:
      items:
        $ref: "#/components/schemas/Chat"
      type: array
    ChatDetails:
      additionalProperties: false
      properties:
        id:
          type: integer
        messages:
          items:
            $ref: "#/components/schemas/ChatMessage"
          type: array
        provider_code:
          type: string
        transport_type:
          type: string
        user_id:
          type: integer
        websocket:
          additionalProperties: false
          properties:
            event:
              type: string
            namespace:
              type: string
            path:
              type: string
            room:
              type: string
            url:
              type: string
          required:
            - url
            - path
            - namespace
            - event
            - room
          type: object
      required:
        - id
        - websocket
      type: object
    ChatMessage:
      additionalProperties: false
      properties:
        chat_id:
          type: integer
        created_at:
          format: "date-time"
          type: string
        id:
          type: integer
        message:
          type: string
      required:
        - id
        - message
      type: object
    ChatMessageArray:
      items:
        $ref: "#/components/schemas/ChatMessage"
      type: array
    Cobro:
      additionalProperties: true
      type: object
    CobroArray:
      items:
        $ref: "#/components/schemas/Cobro"
      type: array
    ConfirmCobroRequest:
      additionalProperties: false
      properties:
        admin_comment:
          type: string
        approved:
          type: boolean
      type: object
    ConfirmTransbankRequest:
      additionalProperties: false
      properties:
        token:
          type: string
        transaction_id:
          type: string
      required:
        - transaction_id
        - token
      type: object
    CreateAdminRequest:
      additionalProperties: false
