                type: string
            required:
              - cobro_id
              - client_id
              - client_name
              - client_rut
              - amount_clp
              - due_date
            type: object
          type: array
      required:
        - clientes_activos
        - clientes_en_mora
        - deuda_pendiente_clp
        - recaudacion_periodo_clp
        - periodo
        - ultimos_morosos
