components:
  schemas:
    Carga:
      additionalProperties: false
      properties:
        closes_at:
          format: "date-time"
          nullable: true
          type: string
        created_at:
          format: "date-time"
          type: string
        id:
          type: integer
        opens_at:
          format: "date-time"
          nullable: true
          type: string
        status:
          enum:
            - OPEN
            - IN_TRANSIT
            - ARRIVED
            - CLOSED
          type: string
        tipo_carga:
          enum:
            - AEREA
            - MARITIMA
          type: string
      required:
        - id
        - tipo_carga
        - status
        - created_at
      type: object
    CargaClientesStatusItem:
      additionalProperties: false
      properties:
        all_orders_reviewed:
          type: boolean
        blocking_cobros_summary:
          items:
            properties:
              cobro_id:
                type: integer
              status:
                type: string
              tipo_cobro:
                type: string
              total_clp:
                type: number
            required:
              - cobro_id
              - tipo_cobro
              - total_clp
              - status
            type: object
          type: array
        client_id:
          type: integer
        client_name:
          type: string
        delivery_id:
          nullable: true
          type: integer
        email:
          type: string
        is_free:
          type: boolean
        orders_reviewed:
          type: integer
        orders_total:
          type: integer
        unpaid_cobros:
          items:
            properties:
              id:
                type: integer
              status:
                type: string
              tipo_cobro:
                type: string
              total_clp:
                type: number
            required:
              - id
              - tipo_cobro
              - total_clp
              - status
            type: object
          type: array
      required:
        - client_id
        - client_name
        - email
        - is_free
        - unpaid_cobros
        - orders_total
        - orders_reviewed
        - all_orders_reviewed
        - blocking_cobros_summary
      type: object
    CargaClientesStatusResponse:
      items:
        $ref: "#/components/schemas/CargaClientesStatusItem"
      type: array
    CargasPaginatedResponse:
      additionalProperties: false
      properties:
        data:
          items:
            $ref: "#/components/schemas/Carga"
          type: array
        meta:
          additionalProperties: false
          properties:
            last_page:
              type: integer
            limit:
              type: integer
            page:
              type: integer
            total:
              type: integer
          required:
            - total
            - page
            - limit
            - last_page
          type: object
      required:
        - data
        - meta
      type: object
    ChangePasswordRequest:
      additionalProperties: false
      properties:
        newPassword:
          description: Nueva clave para la cuenta
          minLength: 6
          type: string
        password:
          description: Clave actual del usuario
          minLength: 1
          type: string
        token:
          description: JWT de acceso del usuario
          type: string
      required:
        - token
        - password
        - newPassword
      type: object
    Chat:
      additionalProperties: false
      properties:
        id:
          type: integer
        provider_code:
          type: string
        transport_type:
          type: string
        user_id:
          type: integer
      required:
        - id
      type: object
    ChatArray:
      items:
        $ref: "#/components/schemas/Chat"
      type: array
    ChatDetails:
      additionalProperties: false
      properties:
        id:
          type: integer
        messages:
          items:
            $ref: "#/components/schemas/ChatMessage"
          type: array
        provider_code:
          type: string
        transport_type:
          type: string
        user_id:
          type: integer
        websocket:
          additionalProperties: false
          properties:
            event:
              type: string
            namespace:
              type: string
            path:
              type: string
            room:
              type: string
            url:
              type: string
          required:
            - url
            - path
            - namespace
            - event
            - room
          type: object
      required:
        - id
        - websocket
      type: object
    ChatMessage:
      additionalProperties: false
      properties:
        id:
          description: ID del mensaje
          type: string
        mensaje:
          description: Contenido del mensaje
          type: string
        productoRef:
          additionalProperties: false
          properties:
            foto:
              description: Imagen de producto (Base64 data URL)
              type: string
            nombre:
              type: string
            precioUsd:
              type: number
            productoId:
              type: string
            proveedorId:
              type: string
          required:
            - productoId
            - proveedorId
            - nombre
            - precioUsd
            - foto
          type: object
        referenced_message_id:
          description: ID del mensaje al que hace referencia
          nullable: true
          type: integer
        sender_id:
          description: ID de base de datos del remitente
          nullable: true
          type: integer
        sender_role:
          description: Rol del remitente
          nullable: true
          type: string
        timestamp:
          description: Fecha en formato ISO 8601
          format: "date-time"
          type: string
        tipo:
          description: Tipo de mensaje
          enum:
            - texto
            - producto
          type: string
        usuario:
          description: Nombre del remitente
          type: string
      required:
        - id
        - usuario
        - mensaje
        - timestamp
        - tipo
      type: object
    ChatMessageArray:
      items:
        $ref: "#/components/schemas/ChatMessage"
      type: array
    ClienteCobrosGroupedResponse:
      additionalProperties: false
      properties:
        data:
          items:
            additionalProperties: false
            properties:
              carga:
                nullable: true
                properties:
                  created_at:
                    format: "date-time"
                    type: string
                  id:
                    type: integer
                  status:
                    type: string
                  tipo_carga:
                    type: string
                type: object
              carga_id:
                nullable: true
                type: integer
              cobros:
                items:
                  $ref: "#/components/schemas/Cobro"
                type: array
            type: object
          type: array
        pagination:
          properties:
            limit:
              type: integer
            page:
              type: integer
            pages:
              type: integer
            total:
              type: integer
          required:
            - total
            - page
            - limit
            - pages
          type: object
      required:
        - data
        - pagination
      type: object
    Cobro:
      additionalProperties: true
      type: object
    CobroArray:
      items:
        $ref: "#/components/schemas/Cobro"
      type: array
    ConfirmCobroRequest:
      additionalProperties: false
      properties:
        admin_comment:
          type: string
        approved:
          type: boolean
      type: object
    ConfirmDeliveryRequest:
      additionalProperties: false
      properties:
        proof_url:
          type: string
      required:
        - proof_url
      type: object
    ConfirmDespachoRequest:
      additionalProperties: false
      properties:
        bultos:
          items:
            properties:
              bulto_number:
                type: integer
              photos:
                items:
                  format: binary
                  type: string
                type: array
              weight_kg:
                nullable: true
                type: number
            required:
              - bulto_number
            type: object
          type: array
        camera_id:
          nullable: true
          type: string
        carrier_proof_url:
          nullable: true
          type: string
        video_ref_info:
          nullable: true
          type: string
      type: object
    ConfirmTransbankRequest:
      additionalProperties: false
      properties:
        token:
          type: string
        transaction_id:
          type: string
      required:
        - transaction_id
        - token
      type: object
    CreateAddressRequest:
      additionalProperties: false
      properties:
        alias:
          type: string
        calle:
          type: string
        comuna:
          type: string
        depto_oficina:
          type: string
        despacho_agency:
          type: string
        housing_type:
          type: string
        is_default:
          type: boolean
        numero:
          type: string
        pickup_instructions:
          type: string
        postal_code:
          type: string
        reference:
          type: string
        region:
          type: string
      required:
        - calle
        - numero
        - comuna
        - region
      type: object
    CreateAdminRequest:
      additionalProperties: false
      properties:
        email:
          format: email
          type: string
        name:
          type: string
        phone:
          type: string
        rut:
          type: string
      required:
        - name
        - email
        - phone
        - rut
      type: object
    CreateCargaRequest:
      additionalProperties: false
      properties:
        tipo_carga:
          enum:
            - AEREA
            - MARITIMA
          type: string
      required:
        - tipo_carga
      type: object
    CreateLogisticsRateRequest:
      additionalProperties: false
      properties:
        concept:
          description: Concepto de cobro logístico
          type: string
        rate_unit:
          description: "Unidad de medida (ej. KG, CBM)"
          type: string
        rate_value:
          description: Valor de la tarifa
          type: number
        sub_type:
          description: Subtipo opcional del concepto
          type: string
        transport_type:
          description: Tipo de carga
          enum:
            - AEREA
            - MARITIMA
          type: string
      required:
        - transport_type
        - concept
        - rate_value
        - rate_unit
      type: object
    CreateMessageRequest:
      additionalProperties: false
      properties:
        message:
          description: Contenido del mensaje
          type: string
        referenced_message_id:
          description: ID del mensaje al que responde
          nullable: true
          type: integer
      required:
        - message
      type: object
    CreateOrderRequest:
      additionalProperties: false
      example:
        productId: 2
        quantity: 1
        talla: 128GB
      properties:
        cargaId:
          type: integer
        productId:
          type: integer
        quantity:
          type: integer
        talla:
          type: string
      required:
        - productId
        - quantity
        - talla
      type: object
    CreateProductRequest:
      additionalProperties: false
      properties:
        marca:
          type: string
        photo_urls:
          items:
            type: string
          type: array
        price_usd:
          type: number
        status:
          type: string
      required:
        - marca
        - price_usd
      type: object
    CreateReturnRequestRequest:
      additionalProperties: false
      properties:
        delivery_id:
          type: integer
        order_id:
          type: integer
        reason:
          type: string
      required:
        - delivery_id
        - order_id
        - reason
      type: object
    CreateSupportTicketRequest:
      additionalProperties: false
      properties:
        description:
          description: Detalle del problema reportado
          minLength: 10
          type: string
        title:
          description: Título del ticket de soporte
          maxLength: 150
          minLength: 5
          type: string
      required:
        - title
        - description
      type: object
    DashboardSummary:
      additionalProperties: false
      properties:
        clientes_activos:
          description: Número de clientes activos no bloqueados
          type: integer
        clientes_en_mora:
          description: Número de clientes en mora
          type: integer
        deuda_pendiente_clp:
          description: Sumatoria de deudas totales pendientes
          type: integer
        periodo:
          additionalProperties: false
          properties:
            fin:
              format: "date-time"
              type: string
            inicio:
              format: "date-time"
              type: string
          required:
            - inicio
            - fin
          type: object
        recaudacion_periodo_clp:
          description: Recaudación total confirmada para el periodo
          type: integer
        ultimos_morosos:
          items:
            additionalProperties: false
            properties:
              amount_clp:
                type: integer
              client_id:
                type: integer
              client_name:
                type: string
              client_rut:
                type: string
              cobro_id:
                type: integer
              due_date:
                format: date
                type: string
            required:
              - cobro_id
              - client_id
              - client_name
              - client_rut
              - amount_clp
              - due_date
            type: object
          type: array
      required:
        - clientes_activos
        - clientes_en_mora
        - deuda_pendiente_clp
        - recaudacion_periodo_clp
        - periodo
        - ultimos_morosos
      type: object
    Delivery:
      additionalProperties: false
      properties:
        carga_id:
          type: integer
        client_id:
          type: integer
        created_at:
          format: "date-time"
          type: string
        delivered_at:
          format: "date-time"
          nullable: true
          type: string
        delivered_by:
          enum:
            - CLIENT
            - ADMIN
          nullable: true
          type: string
        id:
          type: integer
        proof_url:
          nullable: true
          type: string
        status:
          enum:
            - PENDING
            - READY_TO_SHIP
            - SHIPPED
            - DELIVERED
          type: string
      required:
        - id
        - client_id
        - carga_id
        - status
        - created_at
      type: object
    DeliveryArray:
      items:
        $ref: "#/components/schemas/Delivery"
      type: array
    ErrorResponse:
      additionalProperties: false
      properties:
        error:
          type: string
        message:
          type: string
        statusCode:
          type: integer
      required:
        - message
      type: object
    GenericMessage:
      additionalProperties: false
      properties:
        message:
          type: string
      required:
        - message
      type: object
    GenericObject:
      additionalProperties: true
      type: object
    GenericObjectArray:
      items:
        additionalProperties: true
        type: object
      type: array
    GenericOk:
      additionalProperties: false
      properties:
        message:
          type: string
        ok:
          type: boolean
      required:
        - ok
      type: object
    InitiateTransbankRequest:
      additionalProperties: false
      properties:
        amount_clp:
          type: number
        cobro_id:
          type: integer
      required:
        - cobro_id
        - amount_clp
      type: object
    LoginRequest:
      additionalProperties: false
      properties:
        email:
          format: email
          type: string
        password:
          minLength: 1
          type: string
      required:
        - email
        - password
      type: object
    LoginResponse:
      additionalProperties: false
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
      required:
        - accessToken
        - refreshToken
      type: object
    Notification:
      additionalProperties: false
      properties:
        body:
          type: string
        created_at:
          format: "date-time"
          type: string
        id:
          type: integer
        is_read:
          type: boolean
        title:
          type: string
        type:
          type: string
      required:
        - id
        - type
        - title
        - body
      type: object
    NotificationArray:
      items:
        $ref: "#/components/schemas/Notification"
      type: array
    Product:
      additionalProperties: false
      properties:
        id:
          type: integer
        marca:
          type: string
        photo_urls:
          items:
            type: string
          type: array
        price_usd:
          type: number
        status:
          type: string
      required:
        - id
        - marca
        - price_usd
      type: object
    ProductArray:
      items:
        $ref: "#/components/schemas/Product"
      type: array
    ProponerTruequeRequest:
      additionalProperties: false
      properties:
        negotiation_notes:
          description: Notas explicativas o de negociación
          nullable: true
          type: string
        proposed_product_id:
          description: ID del producto ofrecido
          type: integer
        proposed_quantity:
          description: Cantidad del producto ofrecido
          type: integer
      required:
        - proposed_product_id
        - proposed_quantity
      type: object
    RefreshRequest:
      additionalProperties: false
      properties:
        refreshToken:
          description: Refresh token del usuario
          type: string
      type: object
    RefreshResponse:
      additionalProperties: false
      properties:
        accessToken:
          description: Nuevo access token de usuario
          type: string
      required:
        - accessToken
      type: object
    RegisterUserRequest:
      additionalProperties: false
      properties:
        email:
          format: email
          type: string
        name:
          type: string
        password:
          minLength: 6
          type: string
        phone:
          type: string
        role:
          type: string
        rut:
          type: string
        transporte:
          items:
            enum:
              - maritimo
              - aereo
            type: string
          type: array
      required:
        - name
        - email
        - password
        - phone
        - role
        - rut
        - transporte
      type: object
    RegisterUserResponse:
      additionalProperties: false
      properties:
        email:
          format: email
          type: string
        name:
          type: string
        role:
          type: string
        userId:
          type: string
      required:
        - userId
        - email
        - name
        - role
      type: object
    RegistrationApprovalResponse:
      additionalProperties: false
      properties:
        request:
          $ref: "#/components/schemas/RegistrationRequest"
        user:
          $ref: "#/components/schemas/RegisterUserResponse"
      required:
        - request
        - user
      type: object
    RegistrationApproveRequest:
      additionalProperties: false
      properties:
        notes:
          type: string
        password:
          type: string
        reviewedBy:
          type: string
        role:
          type: string
      required:
        - reviewedBy
      type: object
    RegistrationCheckExistsResponse:
      additionalProperties: false
      properties:
        exists:
          description: Si el usuario ya existe
          type: boolean
        field:
          enum:
            - email
            - rut
          type: string
      required:
        - exists
      type: object
    RegistrationComprobanteResponse:
      additionalProperties: false
      properties:
        comprobante:
          description: Comprobante de registro codificado en base64
          type: string
        email:
          format: email
          type: string
      required:
        - email
        - comprobante
      type: object
    RegistrationListResponse:
      additionalProperties: false
      properties:
        count:
          type: integer
        items:
          items:
            $ref: "#/components/schemas/RegistrationRequest"
          type: array
      required:
        - items
        - count
      type: object
    RegistrationRejectRequest:
      additionalProperties: false
      properties:
        notes:
          type: string
        reviewedBy:
          type: string
      required:
        - reviewedBy
      type: object
    RegistrationRequest:
      additionalProperties: false
      properties:
        address:
          type: string
        agency:
          type: string
        city:
          type: string
        comprobanteKey:
          type: string
        comprobanteUrl:
          description: URL firmada de S3 para visualizar el comprobante (validez temporal)
          type: string
        comuna:
          type: string
        consentimiento:
          type: boolean
        deptOrOffice:
          type: string
        email:
          format: email
          type: string
        housingType:
          enum:
            - casa
            - departamento
            - oficina
          type: string
        is_email_verified:
          type: boolean
        is_phone_verified:
          type: boolean
        is_verified:
          type: boolean
        name:
          type: string
        notes:
          type: string
        phone:
          type: string
        pickupCity:
          type: string
        pickupState:
          type: string
        profileType:
          enum:
            - inversor
            - cliente_antiguo
            - cliente
            - proveedor
            - vendedor
            - bodeguero
            - bedeguero
          type: string
        reference:
          type: string
        region:
          type: string
        requestedAt:
          format: "date-time"
          type: string
        reviewedBy:
          type: string
        rut:
          type: string
        status:
          enum:
            - PENDING
            - APPROVED
            - REJECTED
          type: string
        streetAndNumber:
          type: string
        transportType:
          items:
            enum:
              - maritimo
              - aereo
            type: string
          type: array
        zipCode:
          type: string
      required:
        - email
        - name
        - rut
        - phone
        - profileType
        - status
        - requestedAt
      type: object
