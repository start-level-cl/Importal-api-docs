name: Deploy static docs to Vercel

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vercel-static-docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy docs
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check static entrypoint
        run: test -f docs/index.html

      - name: Link Vercel project for static docs
        run: |
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_TOKEN"
          mkdir -p docs/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > docs/.vercel/project.json

      - name: Deploy preview
        if: github.event_name == 'pull_request'
        run: npx --yes vercel@latest deploy --cwd docs --yes --token="$VERCEL_TOKEN"

      - name: Deploy production
        if: github.event_name == 'push'
        run: npx --yes vercel@latest deploy --cwd docs --yes --prod --token="$VERCEL_TOKEN"
