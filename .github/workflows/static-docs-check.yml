name: Static docs check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: static-docs-check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-static-docs:
    name: Validate static documentation artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate published documentation files
        run: node scripts/check-static-docs.mjs
